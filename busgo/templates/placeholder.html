{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="container">
  <div class="state">
    <div class="state-icon reveal" style="--i: 0">{{ icon(page_icon or 'sparkles', 34) }}</div>
    <h1 class="page-title reveal" style="--i: 1">{{ title }}</h1>
    <p class="page-sub reveal" style="--i: 2">This page is built in {{ phase }}.</p>
    <a href="{{ url_for('index') }}" class="btn btn-ghost reveal" style="--i: 3">{{ icon('arrow-left', 18) }} Back home</a>
  </div>
</section>
{% endblock %}
